<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         PANTALLA DE CONTRASEÑA
    =========================================== -->
    <div id="password-screen" class="screen">

        <div class="password-box">
            <div class="lock-icon">🔐</div>

            <h1>Una pequeña sorpresa...</h1>
            <p>Escribe la contraseña para entrar ❤️</p>

            <input
                type="password"
                id="password-input"
                placeholder="Contraseña"
                autocomplete="off"
            >

            <button id="password-button">
                Entrar
            </button>

            <p id="password-error"></p>
        </div>

    </div>


    <!-- ==========================================
         PANTALLA PRINCIPAL / GALAXIA
         NO CAMBIAR LA GALAXIA EXISTENTE
    =========================================== -->
    <div id="main-screen" class="screen hidden">

        <!--
            AQUÍ SE MANTIENE LA GALAXIA QUE YA TIENES.
            No se modifica desde este HTML.
        -->
        <div id="galaxy-container">

            <!-- El contenido actual de tu galaxia
                 puede mantenerse aquí -->

        </div>


        <!-- ======================================
             MENÚ INFERIOR
        ======================================= -->
        <div id="bottom-menu">

            <!-- BOTÓN DE MÚSICA -->
            <button
                id="music-menu-button"
                class="menu-button"
                aria-label="Cambiar canción"
            >
                🎵
            </button>


            <!-- BOTÓN DE FOTOS -->
            <button
                id="photos-menu-button"
                class="menu-button"
                aria-label="Ver nuestras fotos"
            >
                📷
            </button>


            <!-- BOTÓN DE CARTA -->
            <button
                id="letter-menu-button"
                class="menu-button"
                aria-label="Abrir carta"
            >
                💌
            </button>

        </div>

    </div>


    <!-- ==========================================
         MENÚ DE MÚSICA
    =========================================== -->
    <div id="music-panel" class="panel hidden">

        <button class="close-panel" data-close="music-panel">
            ←
        </button>

        <div class="panel-content">

            <div class="panel-icon">🎵</div>

            <h2>Nuestra música</h2>

            <p>Elige una canción ❤️</p>


            <div id="song-list">

                <button
                    class="song-button"
                    data-song="in a god day.mp3"
                >
                    <span>🎶</span>
                    <span>In a God Day</span>
                </button>

                <button
                    class="song-button"
                    data-song="campus fashion.mp3"
                >
                    <span>🎶</span>
                    <span>Campus Fashion</span>
                </button>

                <button
                    class="song-button"
                    data-song="next to you.mp3"
                >
                    <span>🎶</span>
                    <span>Next To You</span>
                </button>

                <button
                    class="song-button"
                    data-song="origami.mp3"
                >
                    <span>🎶</span>
                    <span>Origami</span>
                </button>

            </div>


            <!-- Canción actual -->
            <div id="current-song">

                <span>Reproduciendo:</span>

                <strong id="current-song-name">
                    Ninguna canción
                </strong>

            </div>

        </div>

    </div>


    <!-- ==========================================
         MENÚ DE FOTOS
    =========================================== -->
    <div id="photos-panel" class="panel hidden">

        <button class="close-panel" data-close="photos-panel">
            ←
        </button>

        <div class="panel-content">

            <div class="panel-icon">📷</div>

            <h2>Nuestros recuerdos</h2>


            <!--
                Estado inicial:
                Todavía no hay suficientes fotos.
            -->
            <div id="photos-empty">

                <div class="photo-lock">
                    🔒
                </div>

                <h3>Sin fotos suficientes</h3>

                <p>
                    Porfavor envíame más fotos para llenar
                    este pequeño álbum de nuestros recuerdos ❤️
                </p>

            </div>


            <!--
                GALERÍA
                Aquí después podremos poner todas las fotos.
            -->
            <div id="photo-gallery" class="hidden">

                <!--
                    Las fotos se agregarán aquí.
                    Ejemplo:

                    <img src="foto1.jpg" alt="Nuestro recuerdo">
                -->

            </div>


            <button id="back-from-photos" class="back-button">
                ← Regresar
            </button>

        </div>

    </div>


    <!-- ==========================================
         MENÚ DE CARTA
    =========================================== -->
    <div id="letter-panel" class="panel hidden">

        <button class="close-panel" data-close="letter-panel">
            ←
        </button>

        <div class="letter-content">

            <h2>Para ti ❤️</h2>

            <div class="letter-image-container">

                <img
                    id="letter-image"
                    src="carta.png"
                    alt="Carta"
                >

            </div>


            <button id="back-from-letter" class="back-button">
                ← Regresar
            </button>

        </div>

    </div>


    <!-- ==========================================
         REPRODUCTOR DE MÚSICA
    =========================================== -->
    <audio id="music-player" preload="auto"></audio>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->
    <script src="script.js"></script>

</body>
</html>
